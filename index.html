lliance",year:"2020"}],Ja={name:"Amara Okonkwo",title:"Operations & Program Coordinator",email:"amara.okonkwo@email.com",phone:"(415) 555-0184",location:"Oakland, CA",linkedin:"linkedin.com/in/amaraokonkwo",summary:"Operations and program coordinator with 6+ years of experience supporting fast-growing teams in nonprofit and healthcare settings. Known for turning messy processes into clear systems, improving reporting accuracy, and coordinating cross-functional schedules for teams of 10–25. Seeking a program coordinator role where data-informed operations help more people access care.",skills:["Program Coordination","Operations Management","Project Scheduling","Stakeholder Communication","Excel & Google Sheets","Data Reporting","Process Improvement","Event Logistics","Budget Tracking","Salesforce CRM","Vendor Management","Cross-functional Collaboration"],experience:B0,education:H0,certifications:q0,awards:Y0},G0=`Program Coordinator — Community Health

We are hiring a Program Coordinator to support our community health programs. You will coordinate schedules, track budgets, and keep cross-functional teams aligned across multiple sites.

What you'll do:
• Own day-to-day program coordination, scheduling, and event logistics.
• Track expenses and support budgeting for a portfolio of programs.
• Build and maintain reporting dashboards in Excel and Google Sheets.
• Own process improvement for onboarding, volunteer management, and vendor management.
• Keep stakeholder communication clear across program, clinical, and finance teams.
• Use Salesforce or a similar CRM to keep participant records accurate.
• Support data analysis and share monthly outcomes with leadership.

What we're looking for:
• 3+ years of operations or project management experience.
• Strong written communication and attention to detail.
