name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
  # This repo's Pages source is the legacy "branch main, path /", so the built
  # single-file index.html is committed to the repo root of main for Pages to serve.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: site/dist
      - name: Publish built index.html to main root
        working-directory: site
        run: |
          cp dist/index.html index.html
          rm -rf dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish built site to Pages root [skip ci]" || echo "no changes to publish"
          git push origin main
